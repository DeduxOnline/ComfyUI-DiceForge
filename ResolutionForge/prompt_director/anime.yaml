# Prompt Director data for anime models that use Danbooru tags (Illustrious, Pony).
#
# Slots are filled in the order below; each slot picks one option at random (by seed)
# among the options whose conditions match what was already picked.
#
# Slot fields:
#   name:   slot name, used in conditions and in the node's override inputs
#   group:  how the slot is used: structure (always kept as is), character, outfit,
#           expression, pose, location, details (rewritten by the LLM when one is connected)
#   when:   the slot is only used when these conditions match (same form as for options)
#
# Option fields:
#   id:     name other options refer to (defaults to the tags)
#   tags:   Danbooru tags added to the prompt (can be empty)
#   attrs:  extra names other options can refer to (for example indoor, outdoor, winter)
#   when:   {slot: [names]}: every slot listed must have picked one of the names (its id or attrs)
#   unless: {slot: [names]}: the option is skipped if any slot listed picked one of the names
#   weight: how likely it is picked compared to the others (default 1)
#   pool:   Danbooru tag group sections (as in prompt_director/tag_groups.json, for example
#           "Holding Tags > Food and Drink"): the option adds one tag picked from them at random,
#           popular tags more likely, skipping tags the rating does not allow
#
# hints (at the end): which Danbooru sections the LLM gets tag ideas from, per part of the scene,
# with the same when/unless conditions. Parts without a matching rule use the whole library pool.
#
# More files with the same layout can be added to ComfyUI/models/prompt_director:
# their options are added to the slots with the same name.

slots:
  - name: theme
    group: structure
    options:
      - {id: fantasy, tags: ""}
      - {id: modern, tags: ""}
      - {id: school, tags: ""}
      - {id: cyberpunk, tags: "cyberpunk"}
      - {id: japanese, tags: ""}

  - name: scene
    group: structure
    options:
      - {id: 1girl, tags: "1girl, solo", attrs: [character, female], weight: 3}
      - {id: 1boy, tags: "1boy, solo", attrs: [character, male]}
      - {id: scenery, tags: "scenery, no humans", weight: 0.7}

  - name: location
    group: location
    options:
      # fantasy
      - {id: castle, tags: "castle, outdoors, stone floor, banner", attrs: [outdoor, stone], when: {theme: [fantasy]}}
      - {id: forest, tags: "forest, tree, nature, grass", attrs: [outdoor, nature], when: {theme: [fantasy]}}
      - {id: medieval_town, tags: "medieval, town, cobblestone, building", attrs: [outdoor, city], when: {theme: [fantasy]}}
      - {id: fantasy_library, tags: "library, bookshelf, book, candle, indoors", attrs: [indoor, library], when: {theme: [fantasy]}}
      - {id: throne_room, tags: "throne room, pillar, red carpet, indoors", attrs: [indoor], when: {theme: [fantasy]}}
      - {id: mountain, tags: "mountain, cliff, sky, cloud", attrs: [outdoor, nature], when: {theme: [fantasy]}}
      - {id: flower_field, tags: "flower field, meadow, flower", attrs: [outdoor, nature, summer], when: {theme: [fantasy]}}
      # modern
      - {id: city_street, tags: "city, street, building, crosswalk", attrs: [outdoor, city], when: {theme: [modern]}}
      - {id: cafe, tags: "cafe, indoors, table, window, cup", attrs: [indoor, cafe], when: {theme: [modern]}}
      - {id: bedroom, tags: "bedroom, indoors, bed, pillow", attrs: [indoor, bedroom], when: {theme: [modern]}}
      - {id: beach, tags: "beach, ocean, sand, horizon", attrs: [outdoor, water, summer], when: {theme: [modern]}}
      - {id: park, tags: "park, tree, bench, grass", attrs: [outdoor, nature, park], when: {theme: [modern]}}
      - {id: city_rooftop, tags: "rooftop, cityscape, railing", attrs: [outdoor, city, rooftop], when: {theme: [modern]}}
      - {id: train_station, tags: "train station, railroad tracks, train", attrs: [outdoor, city], when: {theme: [modern]}}
      # school
      - {id: classroom, tags: "classroom, school desk, chalkboard, window, indoors", attrs: [indoor, desk], when: {theme: [school]}}
      - {id: school_hallway, tags: "school, hallway, window, indoors", attrs: [indoor, wall], when: {theme: [school]}}
      - {id: school_rooftop, tags: "school, rooftop, fence, sky", attrs: [outdoor, rooftop], when: {theme: [school]}}
      - {id: school_library, tags: "library, bookshelf, book, indoors", attrs: [indoor, library, desk], when: {theme: [school]}}
      - {id: school_courtyard, tags: "school, outdoors, tree, building", attrs: [outdoor, nature], when: {theme: [school]}}
      # cyberpunk
      - {id: neon_street, tags: "city, street, neon lights, sign, crowd", attrs: [outdoor, city], when: {theme: [cyberpunk]}}
      - {id: alley, tags: "alley, neon lights, graffiti, cable", attrs: [outdoor, city, wall], when: {theme: [cyberpunk]}}
      - {id: megacity_rooftop, tags: "rooftop, cityscape, skyscraper, railing", attrs: [outdoor, city, rooftop], when: {theme: [cyberpunk]}}
      - {id: neon_bar, tags: "bar (place), indoors, counter, neon lights, bottle", attrs: [indoor, bar], when: {theme: [cyberpunk]}}
      - {id: laboratory, tags: "laboratory, indoors, monitor, cable, screen", attrs: [indoor, desk], when: {theme: [cyberpunk]}}
      # japanese
      - {id: shrine, tags: "shrine, torii, stone lantern, stairs", attrs: [outdoor, shrine], when: {theme: [japanese]}}
      - {id: japanese_garden, tags: "garden, pond, stone lantern, bridge, east asian architecture", attrs: [outdoor, nature], when: {theme: [japanese]}}
      - {id: tatami_room, tags: "tatami, shouji, indoors, east asian architecture", attrs: [indoor], when: {theme: [japanese]}}
      - {id: festival, tags: "summer festival, paper lantern, food stand, crowd", attrs: [outdoor, festival, summer], when: {theme: [japanese]}}
      - {id: bamboo_forest, tags: "bamboo forest, bamboo, nature", attrs: [outdoor, nature], when: {theme: [japanese]}}

  - name: time
    group: structure
    options:
      - {id: day, tags: "day", weight: 3}
      - {id: sunset, tags: "sunset", weight: 1.5}
      - {id: night, tags: "night", weight: 2}

  - name: weather
    group: structure
    when: {location: [outdoor]}
    options:
      - {id: clear, tags: "blue sky, cloud", when: {time: [day]}, weight: 3}
      - {id: clear, tags: "orange sky, cloud", when: {time: [sunset]}, weight: 3}
      - {id: clear, tags: "night sky, starry sky, moon", when: {time: [night]}, weight: 3}
      - {id: cloudy, tags: "cloudy sky, overcast", unless: {time: [night]}}
      - {id: rain, tags: "rain, wet, puddle", attrs: [wet], unless: {location: [festival]}}
      - {id: snow, tags: "snow, snowing", attrs: [cold, winter], unless: {location: [summer]}}
      - {id: cherry_blossoms, tags: "cherry blossoms, falling petals", attrs: [spring], when: {theme: [school, modern, japanese], location: [nature, park, shrine, rooftop]}, unless: {time: [night]}}

  - name: framing
    group: structure
    when: {scene: [character]}
    options:
      - {id: portrait, tags: "portrait, close-up", attrs: [close]}
      - {id: upper_body, tags: "upper body", attrs: [close], weight: 2}
      - {id: cowboy_shot, tags: "cowboy shot", attrs: [body], weight: 2}
      - {id: full_body, tags: "full body", attrs: [body, feet], weight: 1.5}

  - name: hair_color
    group: character
    when: {scene: [character]}
    options:
      - {tags: "black hair", weight: 2}
      - {tags: "brown hair", weight: 2}
      - {tags: "blonde hair", weight: 1.5}
      - {tags: "grey hair"}
      - {tags: "white hair"}
      - {tags: "pink hair"}
      - {tags: "blue hair"}
      - {tags: "red hair"}
      - {tags: "purple hair"}
      - {tags: "green hair", weight: 0.5}
      - {tags: "multicolored hair, streaked hair", when: {theme: [cyberpunk]}, weight: 2}
      - {tags: "gradient hair", weight: 0.5}

  - name: hair_style
    group: character
    when: {scene: [character]}
    options:
      - {tags: "long hair", when: {scene: [female]}, weight: 3}
      - {tags: "very long hair", when: {scene: [female]}}
      - {tags: "medium hair", weight: 1.5}
      - {tags: "short hair", weight: 1.5}
      - {tags: "short hair", when: {scene: [male]}, weight: 3}
      - {tags: "long hair, twintails", when: {scene: [female]}}
      - {tags: "long hair, ponytail", when: {scene: [female]}}
      - {tags: "long hair, braid", when: {scene: [female]}}
      - {tags: "bob cut", when: {scene: [female]}}
      - {tags: "hair bun", when: {scene: [female]}, weight: 0.7}
      - {tags: "messy hair", when: {scene: [male]}}
      - {tags: "spiked hair", when: {scene: [male]}, weight: 0.5}

  - name: hair_detail
    group: character
    when: {scene: [character]}
    options:
      - {tags: "", weight: 2}
      - {pool: "Hair Styles > Hairstyles > Front of the head (incl. bangs)", weight: 2}
      - {pool: "Hair Styles > Hairstyles > Top of the head"}
      - {pool: "Hair Styles > Hairstyles > Hair texture", unless: {scene: [male]}}
      - {pool: "Hair > Objects > Accessories for the hair", when: {scene: [female]}, weight: 1.5}

  - name: eye_color
    group: character
    when: {scene: [character]}
    options:
      - {tags: "blue eyes", weight: 2}
      - {tags: "red eyes", weight: 1.5}
      - {tags: "green eyes"}
      - {tags: "purple eyes"}
      - {tags: "yellow eyes"}
      - {tags: "brown eyes", weight: 1.5}
      - {tags: "aqua eyes"}
      - {tags: "heterochromia", weight: 0.3}

  - name: outfit
    group: outfit
    when: {scene: [character]}
    options:
      # fantasy
      - {id: knight, tags: "armor, breastplate, gauntlets, cape", attrs: [armor, combat], when: {theme: [fantasy]}, weight: 1.5}
      - {id: mage, tags: "robe, hooded cloak, wizard hat, holding staff", attrs: [magic], when: {theme: [fantasy]}}
      - {id: adventurer, tags: "leather armor, belt pouch, gloves, cape", attrs: [combat], when: {theme: [fantasy]}}
      - {id: princess, tags: "princess, tiara, gown, frilled dress", attrs: [formal], when: {theme: [fantasy], scene: [female]}}
      - {id: prince, tags: "prince, military uniform, cape, epaulettes", attrs: [formal], when: {theme: [fantasy], scene: [male]}}
      - {id: priestess, tags: "white robe, veil, holding staff", attrs: [magic], when: {theme: [fantasy], scene: [female]}}
      - {id: fantasy_winter, tags: "fur-trimmed cloak, winter clothes, scarf", attrs: [winter], when: {theme: [fantasy], weather: [snow]}, weight: 3}
      # modern
