# Quality, rating and negative tags per model family, added around the scene.
models:
  Illustrious:
    min_post_count: 100 # LLM tags with fewer Danbooru posts count as unknown to the model (tag_check).
    quality: "masterpiece, best quality, amazing quality, very aesthetic, absurdres, newest"
    rating:
      general: "general"
      sensitive: "sensitive"
    negative: "lowres, worst quality, bad quality, bad anatomy, bad hands, extra digits, fewer digits, jpeg artifacts, signature, watermark, username, text, blurry, sketch"
    negative_rating:
      general: "nsfw"
      sensitive: ""
  Pony:
    min_post_count: 500 # Pony was not trained on Danbooru alone, so only well-known tags are kept.
    quality: "score_9, score_8_up, score_7_up, source_anime"
    rating:
      general: "rating_safe"
      sensitive: "rating_questionable"
    negative: "score_6, score_5, score_4, source_pony, source_furry, source_cartoon, lowres, bad anatomy, bad hands, jpeg artifacts, signature, watermark, text"
    negative_rating:
      general: "nsfw, rating_questionable, rating_explicit"
      sensitive: "rating_explicit"
