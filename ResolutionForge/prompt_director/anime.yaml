      - {id: hoodie, tags: "hoodie, shorts", attrs: [casual], when: {theme: [modern]}, unless: {weather: [snow]}}
      - {id: sundress, tags: "sundress, sun hat", attrs: [summer], when: {theme: [modern], scene: [female], location: [outdoor]}, unless: {weather: [snow, rain], time: [night]}}
      - {id: tshirt_shorts, tags: "t-shirt, shorts", attrs: [summer, casual], when: {theme: [modern], location: [summer, park]}, unless: {weather: [snow]}, weight: 2}
      - {id: swimsuit, tags: "swimsuit", attrs: [swimsuit], when: {theme: [modern], location: [water], rating: [sensitive]}, unless: {weather: [snow, rain]}, weight: 3}
      - {id: office, tags: "suit, white shirt, necktie", attrs: [formal], when: {theme: [modern], location: [city, cafe]}}
      - {id: office_lady, tags: "office lady, suit, pencil skirt", attrs: [formal], when: {theme: [modern], scene: [female], location: [city, cafe]}}
      - {id: pajamas, tags: "pajamas", attrs: [sleep], when: {theme: [modern], location: [bedroom]}, weight: 3}
      - {id: winter_coat, tags: "coat, scarf, turtleneck sweater", attrs: [winter], when: {theme: [modern, school], weather: [snow]}, weight: 3}
      - {id: raincoat, tags: "raincoat, hood up", attrs: [rain], when: {theme: [modern, school], weather: [rain]}, weight: 2}
      - {id: sweater, tags: "sweater, skirt", attrs: [casual], when: {theme: [modern], scene: [female]}, unless: {location: [beach]}}
      # school
      - {id: serafuku, tags: "school uniform, serafuku, pleated skirt, neckerchief", attrs: [school_uniform], when: {theme: [school], scene: [female]}, weight: 3}
      - {id: blazer_girl, tags: "school uniform, blazer, plaid skirt, necktie", attrs: [school_uniform], when: {theme: [school], scene: [female]}, weight: 2}
      - {id: gakuran, tags: "school uniform, gakuran", attrs: [school_uniform], when: {theme: [school], scene: [male]}, weight: 2}
      - {id: blazer_boy, tags: "school uniform, blazer, necktie, pants", attrs: [school_uniform], when: {theme: [school], scene: [male]}, weight: 2}
      - {id: school_cardigan, tags: "school uniform, cardigan, scarf", attrs: [school_uniform, winter], when: {theme: [school], weather: [snow]}, weight: 3}
      - {id: gym_uniform, tags: "gym uniform, track jacket", attrs: [casual], when: {theme: [school]}, unless: {location: [library]}, weight: 0.5}
      # cyberpunk
      - {id: techwear, tags: "techwear, black jacket, cropped jacket, headphones", attrs: [tech], when: {theme: [cyberpunk]}, weight: 2}
      - {id: cyborg, tags: "cyborg, single mechanical arm, jacket", attrs: [tech], when: {theme: [cyberpunk]}}
      - {id: street, tags: "leather jacket, fingerless gloves, choker", attrs: [tech], when: {theme: [cyberpunk]}}
      - {id: hooded_mask, tags: "hooded jacket, hood up, mouth mask", attrs: [tech], when: {theme: [cyberpunk]}}
      - {id: bodysuit, tags: "bodysuit, glowing", attrs: [tech], when: {theme: [cyberpunk], scene: [female], rating: [sensitive]}, weight: 0.7}
      - {id: trench_coat, tags: "trench coat, sunglasses", attrs: [tech], when: {theme: [cyberpunk]}, weight: 0.7}
      # japanese
      - {id: kimono, tags: "kimono, obi, hair flower", attrs: [traditional], when: {theme: [japanese], scene: [female]}, weight: 2}
      - {id: kimono_male, tags: "kimono, haori", attrs: [traditional], when: {theme: [japanese], scene: [male]}, weight: 2}
      - {id: yukata, tags: "yukata, obi, holding fan", attrs: [traditional, summer], when: {theme: [japanese]}, unless: {weather: [snow]}, weight: 1.5}
      - {id: yukata_festival, tags: "yukata, obi", attrs: [traditional, summer], when: {theme: [japanese], location: [festival]}, weight: 4}
      - {id: miko, tags: "miko, hakama, red hakama, wide sleeves", attrs: [traditional], when: {theme: [japanese], scene: [female], location: [shrine]}, weight: 4}
      - {id: samurai, tags: "samurai, hakama, katana, sheathed", attrs: [traditional, combat], when: {theme: [japanese], scene: [male]}}

  - name: footwear
    group: outfit
    when: {framing: [feet]}
    options:
      - {tags: "armored boots", when: {outfit: [armor]}, weight: 3}
      - {tags: "boots", when: {theme: [fantasy]}, unless: {outfit: [armor, formal]}}
      - {tags: "high heels", when: {outfit: [formal], scene: [female]}, weight: 2}
      - {tags: "boots", when: {outfit: [formal], scene: [male]}}
      - {tags: "sneakers", when: {outfit: [casual, summer]}}
      - {tags: "sandals", when: {outfit: [summer]}, unless: {outfit: [traditional]}}
      - {tags: "barefoot", when: {outfit: [sleep, swimsuit]}, weight: 3}
      - {tags: "loafers, socks", when: {outfit: [school_uniform]}, weight: 2}
      - {tags: "boots", when: {weather: [snow]}, weight: 2}
      - {tags: "rubber boots", when: {outfit: [rain]}, weight: 2}
      - {tags: "combat boots", when: {outfit: [tech]}}
      - {tags: "geta", when: {outfit: [traditional]}}
      - {tags: "tabi, zouri", when: {outfit: [traditional]}}

  - name: accessory
    group: outfit
    when: {scene: [character]}
    options:
      - {tags: "", weight: 3}
      - {pool: "Accessories > Jewelry", unless: {outfit: [armor, sleep]}, weight: 1.5}
      - {pool: ["Headwear > Hats > With visor", "Headwear > Hats > Brimless"], when: {theme: [modern, school], location: [outdoor]}, unless: {outfit: [formal, sleep, swimsuit]}}
      - {pool: "Headwear > Hats > With brim", when: {theme: [modern], location: [outdoor], time: [day]}, unless: {weather: [rain, snow]}}
      - {pool: "Headwear > Crowns", when: {theme: [fantasy], outfit: [formal, magic]}, weight: 2}
      - {pool: "Headwear > Helmets", when: {theme: [fantasy], outfit: [armor]}}
      - {pool: "Accessories > Bags", when: {theme: [modern, school], location: [outdoor]}, unless: {outfit: [swimsuit]}}
      - {pool: "Attire > Jewelry and Accessories > Head and Face", when: {theme: [cyberpunk]}, weight: 3}
      - {pool: "Accessories > By body part > Arms", when: {theme: [fantasy, cyberpunk]}, unless: {outfit: [armor]}}

  - name: expression
    group: expression
    when: {scene: [character]}
    options:
      - {id: smile, tags: "smile", attrs: [happy], weight: 3}
      - {id: open_smile, tags: "smile, open mouth", attrs: [happy], weight: 2}
      - {id: grin, tags: "grin", attrs: [happy]}
      - {id: calm, tags: "light smile, closed mouth", attrs: [calm], weight: 2}
      - {id: expressionless, tags: "expressionless", attrs: [calm]}
      - {id: shy, tags: "blush, embarrassed", attrs: [shy]}
      - {id: sad, tags: "sad, frown", attrs: [sad], weight: 0.7}
      - {id: crying, tags: "crying, tears", attrs: [sad], weight: 0.4}
      - {id: angry, tags: "angry, frown, clenched teeth", attrs: [angry], weight: 0.5}
      - {id: serious, tags: "serious, closed mouth", attrs: [determined], when: {outfit: [combat, tech]}, weight: 2}
      - {id: surprised, tags: "surprised, open mouth", attrs: [surprised], weight: 0.6}
      - {id: sleepy, tags: "sleepy, half-closed eyes", attrs: [calm], when: {outfit: [sleep]}, weight: 3}

  - name: pose
    group: pose
    when: {scene: [character]}
    options:
      # close framings: upper body only
      - {tags: "hand on own cheek", when: {framing: [close]}, unless: {expression: [angry]}}
      - {tags: "waving, hand up", when: {framing: [close], expression: [happy]}}
      - {tags: "v", when: {expression: [happy]}}
      - {tags: "crossed arms", when: {expression: [angry, determined, calm]}}
      - {tags: "head tilt", when: {expression: [happy, calm, shy]}}
      - {tags: "hands on own chest", when: {framing: [close], expression: [shy, sad]}}
      - {tags: "covering own mouth", when: {expression: [surprised, shy]}}
      - {tags: "wiping tears", when: {expression: [sad]}}
      - {tags: "hand in own hair", when: {framing: [close]}, unless: {expression: [sad, angry]}}
      - {tags: "looking back", unless: {expression: [angry]}}
      # body framings
      - {tags: "standing", when: {framing: [body]}, weight: 2}
      - {tags: "walking", when: {framing: [body], location: [outdoor]}, unless: {expression: [sad]}}
      - {tags: "running", when: {framing: [body], location: [outdoor], expression: [happy, determined]}}
      - {tags: "jumping", when: {framing: [body], location: [outdoor], expression: [happy]}}
      - {tags: "sitting, bench", when: {framing: [body], location: [park]}, weight: 2}
      - {tags: "sitting, school desk", when: {framing: [body], location: [desk]}, weight: 2}
      - {tags: "sitting, chair, holding cup", when: {framing: [body], location: [cafe]}, weight: 2}
      - {tags: "sitting, on bed", when: {framing: [body], location: [bedroom]}, weight: 3}
      - {tags: "sitting, hugging own legs", when: {framing: [body], expression: [sad, calm]}}
      - {tags: "against wall, leaning back", when: {framing: [body], location: [wall, city]}}
      - {tags: "railing, leaning forward", when: {location: [rooftop]}, weight: 2}
      - {tags: "hands in pockets", when: {outfit: [casual, tech]}}
      - {tags: "fighting stance, holding sword", when: {framing: [body], outfit: [armor, combat], expression: [determined, angry, calm]}, weight: 3}
      - {tags: "casting spell, magic, glowing hand", when: {outfit: [magic]}, weight: 3}
      - {tags: "holding umbrella", when: {weather: [rain]}, weight: 3}
      - {tags: "reading, holding book", when: {location: [library]}, weight: 3}
      - {tags: "holding drink, bottle", when: {location: [bar]}, weight: 2}
      - {tags: "holding sword, katana", when: {outfit: [combat], theme: [japanese]}, weight: 2}
      - {tags: "holding fan", when: {outfit: [traditional]}}
      - {tags: "praying, own hands together", when: {location: [shrine]}}
      # held items and gestures from the Danbooru tag groups
      - {pool: ["Holding Tags > Food and Drink > Sweets and Desserts", "Holding Tags > Food and Drink > Drink Containers"], when: {location: [cafe, festival, park]}, weight: 2}
      - {pool: "Holding Tags > Food and Drink > Fast food and Savory", when: {location: [festival, park, city]}}
      - {pool: "Holding Tags > Electronics and Tech > Audio and Communication", when: {theme: [modern, school, cyberpunk]}}
      - {pool: "Holding Tags > Paper and Documents > Books and Reading", when: {theme: [school, fantasy, japanese]}, unless: {outfit: [combat]}}
      - {pool: "Holding Tags > Nature > Flora", when: {location: [nature, park, shrine]}, unless: {weather: [snow]}}
      - {pool: "Holding Tags > Music", when: {theme: [modern, school]}, unless: {location: [library]}, weight: 0.5}
      - {pool: "Holding Tags > Weapons > Melee", when: {outfit: [combat]}, weight: 1.5}
      - {pool: "Holding Tags > Weapons > Ranged", when: {theme: [cyberpunk], expression: [determined, angry, calm]}}
      - {tags: "holding lantern", when: {time: [night], theme: [fantasy, japanese]}}
      - {pool: ["Gestures > Gestures encompassing only one hand > Two open fingers", "Gestures > Gestures encompassing at least two hands"], when: {expression: [happy]}}

  - name: gaze
    group: pose
    when: {scene: [character]}
    options:
      - {tags: "looking at viewer", weight: 4}
      - {tags: "looking afar"}
      - {tags: "looking to the side"}
      - {tags: "looking up", when: {weather: [snow, rain, cherry_blossoms]}, weight: 2}
      - {tags: "from below", when: {framing: [body]}, weight: 0.5}
      - {tags: "from above", weight: 0.5}
      - {tags: "dutch angle", when: {theme: [cyberpunk]}}

  - name: lighting
    group: details
    options:
      - {tags: "sunlight, light rays", when: {time: [day], location: [outdoor]}, unless: {weather: [cloudy, rain, snow]}, weight: 2}
      - {tags: "dappled sunlight", when: {time: [day], location: [nature]}, unless: {weather: [cloudy, rain, snow]}, weight: 2}
      - {tags: "window, sunlight", when: {time: [day], location: [indoor]}, weight: 2}
      - {tags: "backlighting, lens flare", when: {time: [sunset], location: [outdoor]}, unless: {weather: [rain, cloudy]}, weight: 2}
      - {tags: "window, orange theme", when: {time: [sunset], location: [indoor]}, weight: 2}
      - {tags: "moonlight", when: {time: [night], location: [outdoor]}, unless: {weather: [rain, cloudy], location: [city]}}
      - {tags: "city lights, bokeh", when: {time: [night], location: [city]}, weight: 2}
      - {tags: "neon lights, glowing", when: {theme: [cyberpunk]}, weight: 2}
