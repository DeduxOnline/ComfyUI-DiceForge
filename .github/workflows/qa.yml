# The QA tools of e2e/qa on GitHub Actions, for the agents (.claude/agents) when the machine they run on has no Node.js: on a ComfyUI commit, branch
# or tag (master by default), the frontend internals DiceForge relies on (internals.js, comfy-watcher), a picture and the size checks of every node
# in both designs (nodes.js, tester), and the times with a lot of data at two scales (perf.js, perf). Everything they make (e2e/qa/out) is kept as
# the qa-out artifact, and the run's summary says which tool found problems. Only by hand: Run workflow on the Actions page.
name: QA tools

on:
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: ComfyUI commit, branch or tag to look at
        default: master
      perf_scales:
        description: The data scales of perf.js, separated by spaces
        default: "1 3"

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMFYUI_REF: ${{ inputs.comfyui_ref }}
  COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
  COMFYUI_PYTHON: python
  PYTHON_VERSION: "3.11"

jobs:
  qa:
    name: QA tools on ComfyUI ${{ inputs.comfyui_ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check out ComfyUI (${{ env.COMFYUI_REF }})
        uses: actions/checkout@v7
        with:
          repository: comfyanonymous/ComfyUI
          ref: ${{ env.COMFYUI_REF }}
          path: ComfyUI

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt

      - name: Install ComfyUI's Python packages (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu # torchaudio: ComfyUI before 2026-09-21 asks for it, and PyPI's build needs CUDA
          pip install -r ComfyUI/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The same cache as the end-to-end tests (tests.yml): Chromium and the Ubuntu packages it needs.
      - name: Keep Chromium and its system packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: playwright-ubuntu-24.04-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          mkdir -p ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\"; APT::Keep-Downloaded-Packages \"true\";" | sudo tee /etc/apt/apt.conf.d/99diceforge-cache
          npx playwright install --with-deps chromium
          sudo chown -R "$USER" ~/apt-cache # apt wrote it as root; the cache is saved as the runner's user.

      - name: Which ComfyUI and frontend
        run: |
          mkdir -p e2e/qa/out
          { echo "ComfyUI $(git -C ComfyUI rev-parse HEAD) ($COMFYUI_REF)"; pip show comfyui-frontend-package | grep -i '^version'; } | tee e2e/qa/out/versions.txt

      # Each tool runs even when the one before it found problems; the last step fails the run if any did.
      - name: Frontend internals (internals.js)
        id: internals
        continue-on-error: true
        run: |
          node e2e/qa/internals.js | tee e2e/qa/out/internals.txt
          node e2e/qa/internals.js --json > e2e/qa/out/internals.json

      - name: Start the e2e server
        run: e2e/qa/serve.sh start

      - name: Every node in both designs (nodes.js)
        id: nodes
        continue-on-error: true
        working-directory: e2e
        run: node qa/nodes.js 2>&1 | tee qa/out/nodes.txt

      - name: Times with a lot of data (perf.js)
        id: perf
        continue-on-error: true
        working-directory: e2e
        env:
          SCALES: ${{ inputs.perf_scales }}
        run: |
          status=0
          for scale in $SCALES; do
            node qa/perf.js --scale "$scale" 2>&1 | tee "qa/out/perf_scale_$scale.txt" || status=1
          done
          exit "$status"

      - name: Stop the e2e server
        if: ${{ always() }}
        run: e2e/qa/serve.sh stop

      - name: Keep what the tools made
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-out
          path: e2e/qa/out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: ${{ always() }}
        env:
          INTERNALS: ${{ steps.internals.outcome }}
          NODES: ${{ steps.nodes.outcome }}
          PERF: ${{ steps.perf.outcome }}
        run: |
          {
            echo "### QA tools on ComfyUI $COMFYUI_REF"
            echo
            cat e2e/qa/out/versions.txt 2>/dev/null || true
            echo
            echo "| Tool | Outcome |"
            echo "|---|---|"
            echo "| internals.js | $INTERNALS |"
            echo "| nodes.js | $NODES |"
            echo "| perf.js | $PERF |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$INTERNALS" == success && "$NODES" == success && "$PERF" == success ]]
