# DiceForge tests on GitHub Actions: the unit tests (tests/, pytest) and the end-to-end tests (e2e/, Playwright: a real ComfyUI server and browser),
# on the CPU, against a pinned ComfyUI version (the one the tests were written with). A weekly run tests against ComfyUI's latest master too, to see
# early when a ComfyUI update breaks something; a manual run can pick any ComfyUI commit, branch or tag.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays: against ComfyUI master.
  workflow_call: # From the Release workflow: a tag is only released when the tests pass.
    inputs:
      comfyui_ref:
        description: ComfyUI commit, branch or tag to test with
        type: string
        default: 79be670e2d9be63e238785af307369d2b9039ed1
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: ComfyUI commit, branch or tag to test with
        default: 79be670e2d9be63e238785af307369d2b9039ed1

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMFYUI_REF: ${{ github.event_name == 'schedule' && 'master' || inputs.comfyui_ref || '79be670e2d9be63e238785af307369d2b9039ed1' }}
  COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
  PYTHON_VERSION: "3.11"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Here, not on the step: a step's condition can't see the step's own env (and not secrets).
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # The whole history: SonarQube Cloud tells new code from old by it.

      - name: Check out ComfyUI (${{ env.COMFYUI_REF }})
        uses: actions/checkout@v5
        with:
          repository: comfyanonymous/ComfyUI
          ref: ${{ env.COMFYUI_REF }}
          path: ComfyUI

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt

      - name: Install ComfyUI's Python packages (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt pytest hypothesis pytest-cov

      - name: Check the workflows (actionlint)
        run: |
          pip install actionlint-py
          actionlint

      - name: Run the unit tests
        run: python -m pytest tests -v --cov=DiceForge --cov-branch --cov-report=xml:coverage.xml --cov-report=term
        env:
          HYPOTHESIS_PROFILE: ci # The same generated examples every run, so a red run is a real bug, not bad luck.

      # Code analysis and the coverage above on SonarQube Cloud (settings: sonar-project.properties). Only with the SONAR_TOKEN secret: without it
      # (before it is set up, or a pull request from a fork) the step is skipped instead of failing.
      # Pinned to the commit of a release (the comment names it); Dependabot moves both together.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

      # The results on GitHub: Quality Gate, measures, open issues and security hotspots on the run's summary page and in this log.
      - name: SonarQube Cloud results
        if: ${{ env.SONAR_TOKEN != '' }}
        run: python .github/scripts/sonar_summary.py

  # Whether the end-to-end tests have something to test: a push or pull request that changes only the docs, the unit tests or the agents
  # leaves them out. The node pack, the e2e tests and this workflow count; the weekly, manual and release runs always have them.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Changes the end-to-end tests cover
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a tag has no commit before it (all zeros): everything counts.
          if [[ "$EVENT" != push && "$EVENT" != pull_request ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(DiceForge/|e2e/|\.github/workflows/tests\.yml$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No change to DiceForge/, e2e/ or this workflow: the end-to-end tests are left out."
          fi

  e2e:
    # Five jobs at once, each with its own ComfyUI server (the tests of one server share its files and memory, so they run one at a time).
    name: End-to-end tests (${{ matrix.group }})
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: API and nodes
            files: api.spec.js ui-nodes.spec.js
          - group: prompts
            files: ui-prompts.spec.js
          - group: models
            files: ui-models.spec.js
          - group: robustness
            files: robustness.spec.js ui-robustness.spec.js
          - group: ComfyUI contract and old workflows
            files: contract.spec.js compat.spec.js
    steps:
      - uses: actions/checkout@v5

      - name: Check out ComfyUI (${{ env.COMFYUI_REF }})
        uses: actions/checkout@v5
        with:
          repository: comfyanonymous/ComfyUI
          ref: ${{ env.COMFYUI_REF }}
          path: ComfyUI

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt

      - name: Install ComfyUI's Python packages (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        env:
          COMFYUI_PYTHON: python
        run: npx playwright test ${{ matrix.files }}

      - name: Keep the Playwright report (screenshots and traces of failures)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            e2e/report/
            e2e/results/
          retention-days: 14
          if-no-files-found: ignore
