# SonarQube Cloud (sonarcloud.io): code analysis of DiceForge on every push to main and every pull request, with the coverage of the unit tests.
# The scan runs in GitHub Actions (.github/workflows/tests.yml, unit job) when the repository has the SONAR_TOKEN secret.
sonar.organization=deduxonline
sonar.projectKey=DeduxOnline_ComfyUI-DiceForge
sonar.projectName=ComfyUI-DiceForge

# The node pack is the code; the tests are tests. ComfyUI, checked out next to the code by the workflow, is not part of the project.
sonar.sources=DiceForge
sonar.tests=tests,e2e
sonar.exclusions=**/__pycache__/**
sonar.test.exclusions=e2e/node_modules/**,e2e/results/**,e2e/report/**
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Coverage of the unit tests (pytest-cov, written by the workflow). The frontend (DiceForge/web) is tested end to end in a browser (e2e), which
# measures no line coverage, so it is left out of the coverage figure instead of counting as untested.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=DiceForge/web/**
