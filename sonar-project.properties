# SonarQube Cloud (sonarcloud.io): code analysis of DiceForge on every push to main and every pull request, with the coverage of the unit tests.
# The scan runs in GitHub Actions (.github/workflows/tests.yml, unit job) when the repository has the SONAR_TOKEN secret.
sonar.organization=deduxonline
sonar.projectKey=DeduxOnline_ComfyUI-DiceForge
sonar.projectName=ComfyUI-DiceForge

# The node pack is the code; the tests are tests. ComfyUI, checked out next to the code by the workflow, is not part of the project.
sonar.sources=DiceForge
sonar.tests=tests,e2e
sonar.exclusions=**/__pycache__/**
sonar.test.exclusions=e2e/node_modules/**,e2e/results/**,e2e/report/**
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Coverage of the unit tests (pytest-cov, written by the workflow). The frontend (DiceForge/web) is tested end to end in a browser (e2e), which
# measures no line coverage, so it is left out of the coverage figure instead of counting as untested.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=DiceForge/web/**

# Findings that are wrong for this code, ignored by rule and file (SonarQube Cloud doesn't honour NOSONAR comments for these):
# S2245 (pseudorandom generator): random.Random picks prompt options from the seed, reproducible on purpose; nothing security-related.
# S1244 (float equality): weight == 1.0 compares with the exact default weight, never a computed value.
# S930 (unexpected argument): ImageFont.load_default(size=...) exists since Pillow 10.1; older Pillow raises TypeError, which is handled.
sonar.issue.ignore.multicriteria=random1,random2,weight,font
sonar.issue.ignore.multicriteria.random1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.random1.resourceKey=DiceForge/seed_modes.py
sonar.issue.ignore.multicriteria.random2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.random2.resourceKey=DiceForge/clip_text_encode_pos_neg.py
sonar.issue.ignore.multicriteria.weight.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.weight.resourceKey=DiceForge/clip_text_encode_pos_neg.py
sonar.issue.ignore.multicriteria.font.ruleKey=python:S930
sonar.issue.ignore.multicriteria.font.resourceKey=DiceForge/dice_grid.py
